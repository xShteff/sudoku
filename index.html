<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<title>Sudoku</title>

<!-- Installable PWA: manifest + icons -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<!-- Standalone "native app" behaviour once added to the home screen -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Sudoku">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>SUDOKU</h1>
      <div class="status">
        <span>Score: <b id="score">0</b></span>
        <span>Mistakes: <b id="mistakes">0</b></span>
        <span>Time: <b id="timer">0:00</b></span>
        <span>Best: <b id="best">—</b></span>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings" title="Settings">⚙</button>
    </header>

    <div class="difficulty" id="difficulty">
      <button data-level="easy" class="active">Easy</button>
      <button data-level="medium">Medium</button>
      <button data-level="hard">Hard</button>
    </div>

    <div class="main">
      <div class="board" id="board"></div>

      <div class="side">
        <div class="numpad" id="numpad">
          <div class="numgrid">
            <button data-n="1">1</button>
            <button data-n="2">2</button>
            <button data-n="3">3</button>
            <button data-n="4">4</button>
            <button data-n="5">5</button>
            <button data-n="6">6</button>
            <button data-n="7">7</button>
            <button data-n="8">8</button>
            <button data-n="9">9</button>
          </div>
          <button data-n="0" class="erase">Erase</button>
        </div>

        <div class="controls">
          <button id="newGame" class="primary">New Game</button>
        </div>
      </div>
    </div>

    <!-- Tap a digit to highlight every cell that holds it (toggle off by tapping again). -->
    <div class="highlighter" id="highlighter" aria-label="Highlight a number on the board">
      <button data-h="1">1<small></small></button>
      <button data-h="2">2<small></small></button>
      <button data-h="3">3<small></small></button>
      <button data-h="4">4<small></small></button>
      <button data-h="5">5<small></small></button>
      <button data-h="6">6<small></small></button>
      <button data-h="7">7<small></small></button>
      <button data-h="8">8<small></small></button>
      <button data-h="9">9<small></small></button>
    </div>
  </div>

  <div class="toast" id="toast">Solved! 🎉</div>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle">Settings</h2>
        <button id="closeSettings" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <label class="setting-row">
        <span class="setting-text">
          <b>Save progress</b>
          <small>Keep your current game and timer when you reload the page.</small>
        </span>
        <input type="checkbox" id="saveProgressToggle" class="switch">
      </label>
      <label class="setting-row">
        <span class="setting-text">
          <b>Hide finished numbers</b>
          <small>Remove a number from the highlight bar once all nine are placed.</small>
        </span>
        <input type="checkbox" id="hideCompletedToggle" class="switch">
      </label>
    </div>
  </div>

<script src="js/app.js"></script>
<script>
  // Register the service worker so the app can be installed and run offline.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        /* registration failing just means no offline/install — play still works */
      });
    });
  }
</script>
</body>
</html>
