<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<title>Sudoku</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>SUDOKU</h1>
      <div class="status">
        <span>Mistakes: <b id="mistakes">0</b></span>
        <span>Time: <b id="timer">0:00</b></span>
        <span>Best: <b id="best">—</b></span>
      </div>
    </header>

    <div class="difficulty" id="difficulty">
      <button data-level="easy" class="active">Easy</button>
      <button data-level="medium">Medium</button>
      <button data-level="hard">Hard</button>
    </div>

    <div class="main">
      <div class="board" id="board"></div>

      <div class="side">
        <div class="numpad" id="numpad">
          <div class="numgrid">
            <button data-n="1">1</button>
            <button data-n="2">2</button>
            <button data-n="3">3</button>
            <button data-n="4">4</button>
            <button data-n="5">5</button>
            <button data-n="6">6</button>
            <button data-n="7">7</button>
            <button data-n="8">8</button>
            <button data-n="9">9</button>
          </div>
          <button data-n="0" class="erase">Erase</button>
        </div>

        <div class="controls">
          <button id="newGame" class="primary">New Game</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Solved! 🎉</div>

<script src="js/app.js"></script>
</body>
</html>
